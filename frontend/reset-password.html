<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · Virtual Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:var(--bg);">
  <div class="auth-form-inner fade-up">

    <!-- Back link -->
    <a href="login.html" style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--muted);text-decoration:none;margin-bottom:2.5rem;transition:color 0.2s;"
      onmouseover="this.style.color='var(--gold)'"
      onmouseout="this.style.color='var(--muted)'">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Back to login
    </a>

    <p class="auth-brand">Virtual Gallery</p>
    <h2 class="auth-heading">New password</h2>
    <div class="auth-rule"></div>

    <p style="font-size:0.875rem;color:var(--muted);line-height:1.75;margin-bottom:1.75rem;">
      Enter a new password for your account. Make it strong!
    </p>

    <div id="alert" class="alert" style="display:none"></div>

    <!-- Form -->
    <div id="formWrap">
      <form id="resetForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="newPassword" placeholder="Min. 6 characters" required />
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="Toggle password">
              <svg id="eyeShow" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeHide" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-input" type="password" id="confirmPassword" placeholder="Re-enter password" required />
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Reset Password</button>

      </form>
    </div>

    <!-- Success state -->
    <div id="successWrap" style="display:none; text-align:center; padding:1.75rem; background:var(--green-bg); border:1px solid #b3dfd1; border-radius:var(--radius); animation: scaleIn 0.3s ease;">
      <div style="font-family:var(--font-display);font-size:2.5rem;color:var(--green);margin-bottom:0.5rem;">✓</div>
      <p style="font-weight:500;color:var(--green);margin-bottom:0.4rem;">Password reset!</p>
      <p style="font-size:0.8rem;color:#4a9a7a;margin-bottom:1.25rem;">You can now sign in with your new password.</p>
      <a href="login.html" style="display:inline-block;padding:0.7rem 1.75rem;background:var(--dark);color:white;text-decoration:none;border-radius:var(--radius-sm);font-size:0.875rem;font-weight:500;transition:background 0.2s;"
        onmouseover="this.style.background='var(--dark-2)'"
        onmouseout="this.style.background='var(--dark)'">
        Go to Login
      </a>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script>
  // Redirect if already logged in
  if (localStorage.getItem('vg_token')) location.href = 'gallery.html'

  // Eye toggle
  const eyeBtn  = document.getElementById('eyeBtn')
  const passIn  = document.getElementById('newPassword')
  const eyeShow = document.getElementById('eyeShow')
  const eyeHide = document.getElementById('eyeHide')
  eyeBtn.addEventListener('click', () => {
    const show = passIn.type === 'password'
    passIn.type           = show ? 'text'  : 'password'
    eyeShow.style.display = show ? 'none'  : ''
    eyeHide.style.display = show ? ''      : 'none'
  })

  const alertEl   = document.getElementById('alert')
  const submitBtn = document.getElementById('submitBtn')

  function showAlert(msg, type = 'error') {
    alertEl.textContent   = msg
    alertEl.className     = `alert alert-${type}`
    alertEl.style.display = ''
  }

  // Get token from URL ?token=XXXX
  const urlParams = new URLSearchParams(window.location.search)
  const resetToken = urlParams.get('token')

  if (!resetToken) {
    showAlert('Invalid or missing reset link. Please request a new one.')
    document.getElementById('resetForm').style.display = 'none'
  }

  document.getElementById('resetForm').addEventListener('submit', async e => {
    e.preventDefault()
    alertEl.style.display = 'none'

    const newPassword     = document.getElementById('newPassword').value
    const confirmPassword = document.getElementById('confirmPassword').value

    if (!newPassword)                    { showAlert('Please enter a new password.'); return }
    if (newPassword.length < 6)          { showAlert('Password must be at least 6 characters.'); return }
    if (newPassword !== confirmPassword) { showAlert('Passwords do not match.'); return }

    submitBtn.disabled    = true
    submitBtn.textContent = 'Resetting…'

    try {
      const res = await fetch(`${API_BASE}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, newPassword }),
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || 'Reset failed')

      document.getElementById('formWrap').style.display    = 'none'
      document.getElementById('successWrap').style.display = ''
    } catch (err) {
      showAlert(err.message)
      submitBtn.disabled    = false
      submitBtn.textContent = 'Reset Password'
    }
  })
</script>

</body>
</html>

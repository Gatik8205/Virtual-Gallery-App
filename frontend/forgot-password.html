<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password · Virtual Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:var(--bg);">
  <div class="auth-form-inner fade-up">

    <a href="login.html" style="display:inline-flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--muted);text-decoration:none;margin-bottom:2.5rem;transition:color 0.2s;" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--muted)'">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to login
    </a>

    <p class="auth-brand">Virtual Gallery</p>
    <h2 class="auth-heading">Reset password</h2>
    <div class="auth-rule"></div>

    <p style="font-size:0.875rem;color:var(--muted);line-height:1.75;margin-bottom:1.75rem;">
      Enter your email and we'll send you a link to reset your password.
    </p>

    <div id="alert" class="alert" style="display:none"></div>

    <!-- Form (hidden after success) -->
    <div id="formWrap">
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
      </form>
    </div>

    <!-- Success state -->
    <div id="successWrap" style="display:none; text-align:center; padding:1.5rem; background:var(--green-bg); border:1px solid #b3dfd1; border-radius:var(--radius); animation: scaleIn 0.3s ease;">
      <div style="font-family:var(--font-display);font-size:2.5rem;color:var(--green);margin-bottom:0.5rem;">✓</div>
      <p style="font-weight:500;color:var(--green);margin-bottom:0.35rem;">Check your inbox</p>
      <p style="font-size:0.8rem;color:#4a9a7a;" id="sentMsg"></p>
    </div>

  </div>
</div>

<script src="api.js"></script>
<script>
  if (localStorage.getItem('vg_token')) location.href = 'gallery.html'

  const alertEl   = document.getElementById('alert')
  const submitBtn = document.getElementById('submitBtn')

  function showAlert(msg, type = 'error') {
    alertEl.textContent   = msg
    alertEl.className     = `alert alert-${type}`
    alertEl.style.display = ''
  }

  document.getElementById('forgotForm').addEventListener('submit', async e => {
    e.preventDefault()
    alertEl.style.display = 'none'
    const email = document.getElementById('email').value.trim()
    if (!email) { showAlert('Please enter your email.'); return }

    submitBtn.disabled    = true
    submitBtn.textContent = 'Sending…'
    try {
      await apiForgotPassword(email)
      document.getElementById('formWrap').style.display    = 'none'
      document.getElementById('sentMsg').textContent       = `We've sent a reset link to ${email}`
      document.getElementById('successWrap').style.display = ''
    } catch (err) {
      showAlert(err.message)
      submitBtn.disabled    = false
      submitBtn.textContent = 'Send Reset Link'
    }
  })
</script>
</body>
</html>
